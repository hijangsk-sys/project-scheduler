<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>개인 프로젝트 스케줄러</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "맑은 고딕", sans-serif; background: #f8fafc; color: #1e293b; overflow: hidden; }
    .main-layout { display: flex; height: calc(100vh - 64px); overflow: hidden; position: relative; }
    .left-sidebar { width: 220px; flex-shrink: 0; display: flex; flex-direction: column; background: #ffffff; border-right: 1px solid #cbd5e1; position: sticky; left: 0; z-index: 30; }
    .right-timeline { flex: 1; overflow-x: auto; overflow-y: auto; background: #ffffff; position: relative; -webkit-overflow-scrolling: touch; }
    button, .clickable { touch-action: manipulation; }

    /* 스크롤바 스타일 */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body>

  <!-- 상단 헤더 -->
  <header class="bg-slate-900 border-b border-slate-800 px-3 sm:px-4 py-2.5 flex items-center justify-between gap-2 h-[64px] shadow-md">
    <div class="flex items-center space-x-2.5 min-w-0">
      <div class="bg-indigo-600 text-white p-2 rounded-xl text-base flex-shrink-0 shadow">
        <i class="fa-solid fa-bars-staggered"></i>
      </div>
      <div class="truncate">
        <h1 class="text-sm sm:text-base font-bold text-white leading-tight truncate">개인 프로젝트 스케줄러</h1>
        <p class="text-[11px] text-slate-400 hidden sm:block">PC와 모바일에서 일정을 한눈에 관리</p>
      </div>
    </div>

    <div class="flex items-center gap-1.5 sm:gap-2 flex-shrink-0">
      <!-- 완료된 할 일 보기 필터 토글 -->
      <label class="flex items-center gap-1.5 bg-slate-800 px-2.5 py-1 rounded-lg border border-slate-700 text-xs text-slate-300 cursor-pointer select-none">
        <input type="checkbox" id="show-completed-checkbox" checked onchange="toggleShowCompleted()" class="rounded text-indigo-600 focus:ring-indigo-500 w-3.5 h-3.5">
        <span class="hidden sm:inline">완료된 할 일 보기</span>
      </label>

      <!-- 일/주/월 뷰 전환 -->
      <div class="bg-slate-800 p-1 rounded-lg flex items-center border border-slate-700">
        <button id="btn-scale-day" onclick="setScale('day')" class="px-2 sm:px-2.5 py-1 text-xs font-medium rounded transition-colors bg-indigo-600 text-white shadow">일</button>
        <button id="btn-scale-week" onclick="setScale('week')" class="px-2 sm:px-2.5 py-1 text-xs font-medium rounded text-slate-300 hover:text-white transition-colors">주</button>
        <button id="btn-scale-month" onclick="setScale('month')" class="px-2 sm:px-2.5 py-1 text-xs font-medium rounded text-slate-300 hover:text-white transition-colors">월</button>
      </div>

      <!-- 날짜 네비게이션 -->
      <div class="flex items-center space-x-1 bg-slate-800 p-1 rounded-lg border border-slate-700">
        <button onclick="navigateTimeline(-1)" title="과거로 이동" class="px-1.5 sm:px-2 py-1 text-xs font-medium text-slate-300 hover:text-white rounded hover:bg-slate-700"><i class="fa-solid fa-chevron-left"></i></button>
        <button onclick="goToToday()" class="px-2 sm:px-2.5 py-1 text-xs font-medium text-slate-300 hover:text-white rounded hover:bg-slate-700 whitespace-nowrap">오늘</button>
        <button onclick="navigateTimeline(1)" title="미래로 이동" class="px-1.5 sm:px-2 py-1 text-xs font-medium text-slate-300 hover:text-white rounded hover:bg-slate-700"><i class="fa-solid fa-chevron-right"></i></button>
      </div>

      <!-- 추가 버튼 -->
      <button onclick="openProjectModal()" class="px-2.5 py-1.5 text-xs font-semibold bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg shadow transition-colors flex items-center gap-1 whitespace-nowrap cursor-pointer">
        <i class="fa-solid fa-folder-plus"></i> <span class="hidden md:inline">프로젝트</span> 추가
      </button>
      <button onclick="openTaskModal()" class="px-2.5 py-1.5 text-xs font-semibold bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg shadow transition-colors flex items-center gap-1 whitespace-nowrap cursor-pointer">
        <i class="fa-solid fa-plus"></i> 할 일 추가
      </button>

      <!-- 백업/복원/초기화 -->
      <div class="hidden sm:flex items-center space-x-1 pl-1.5 border-l border-slate-700">
        <button onclick="exportData()" title="백업" class="p-1.5 text-xs text-slate-300 hover:text-white hover:bg-slate-800 rounded"><i class="fa-solid fa-download"></i></button>
        <button onclick="document.getElementById('import-file-input').click()" title="복원" class="p-1.5 text-xs text-slate-300 hover:text-white hover:bg-slate-800 rounded"><i class="fa-solid fa-upload"></i></button>
        <button onclick="resetToSampleData()" title="리셋" class="p-1.5 text-xs text-amber-300 hover:text-amber-200 hover:bg-slate-800 rounded"><i class="fa-solid fa-rotate-right"></i></button>
        <input type="file" id="import-file-input" class="hidden" accept=".json" onchange="importData(event)">
      </div>
    </div>
  </header>

  <!-- 메인 스케줄러 영역 -->
  <main class="main-layout">
    <!-- 좌측 프로젝트 목록 -->
    <div id="left-panel" class="left-sidebar">
      <div class="px-3 bg-slate-100 border-b border-slate-300 font-semibold text-xs text-slate-700 flex justify-between items-center h-[48px] flex-shrink-0">
        <span>프로젝트 (클릭 수정)</span>
        <span class="text-[11px] font-normal text-slate-400">▲/▼ 순서</span>
      </div>
      <div id="project-list-scroll" class="flex-1 overflow-hidden">
        <div id="project-list-container" class="flex flex-col"></div>
      </div>
    </div>

    <!-- 우측 타임라인 영역 -->
    <div id="timeline-container" class="right-timeline">
      <div id="timeline-inner" class="min-w-max min-h-full flex flex-col relative bg-white">
        <!-- 날짜 헤더 -->
        <div id="timeline-header" class="sticky top-0 z-20 bg-slate-100 border-b border-slate-300 flex h-[48px]"></div>
        <!-- 프로젝트별 할 일 행 -->
        <div id="timeline-rows" class="flex-1 relative"></div>
      </div>
    </div>
  </main>

  <!-- 프로젝트 추가/수정 모달 -->
  <div id="project-modal" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden">
      <div class="px-5 py-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
        <h3 id="project-modal-title" class="font-bold text-slate-800">새 프로젝트 추가</h3>
        <button onclick="closeProjectModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <form id="project-form" onsubmit="saveProject(event)" class="p-5 space-y-4">
        <input type="hidden" id="project-id" />
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1.5">프로젝트 이름</label>
          <input type="text" id="project-name" required placeholder="예: 신규 서비스 런칭" class="w-full px-3 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1.5">색상 선택</label>
          <div id="color-picker" class="flex gap-2.5 flex-wrap"></div>
          <input type="hidden" id="project-color" value="#3b82f6" />
        </div>
        <!-- 프로젝트 완료 체크박스 추가 -->
        <div class="flex items-center gap-2 pt-1">
          <input type="checkbox" id="project-completed" class="rounded text-indigo-600 focus:ring-indigo-500 w-4 h-4 cursor-pointer">
          <label for="project-completed" class="text-xs font-semibold text-slate-700 cursor-pointer">이 프로젝트 완료하기 (소속된 모든 할 일도 함께 완료)</label>
        </div>
        <div class="pt-2 flex justify-between items-center">
          <button type="button" id="btn-delete-project" onclick="deleteProject()" class="hidden px-3 py-2 text-xs font-semibold text-rose-600 hover:bg-rose-50 rounded-lg">프로젝트 삭제</button>
          <div class="flex gap-2 ml-auto">
            <button type="button" onclick="closeProjectModal()" class="px-4 py-2 text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg">취소</button>
            <button type="submit" class="px-4 py-2 text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-500 rounded-lg">저장</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- 할 일 추가/수정 모달 -->
  <div id="task-modal" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden">
      <div class="px-5 py-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
        <h3 id="task-modal-title" class="font-bold text-slate-800">새 할 일 추가</h3>
        <button onclick="closeTaskModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <form id="task-form" onsubmit="saveTask(event)" class="p-5 space-y-4">
        <input type="hidden" id="task-id" />
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1.5">프로젝트 이름</label>
          <select id="task-project-id" required class="w-full px-3 py-2.5 border border-slate-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500"></select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1.5">할 일 제목</label>
          <input type="text" id="task-title" required placeholder="예: 기획서 작성 및 검토" class="w-full px-3 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1.5">시작일</label>
            <input type="date" id="task-start" required class="w-full px-3 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1.5">종료일</label>
            <input type="date" id="task-end" required class="w-full px-3 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
          </div>
        </div>
        <div class="flex items-center gap-2 pt-1">
          <input type="checkbox" id="task-completed" class="rounded text-indigo-600 focus:ring-indigo-500 w-4 h-4 cursor-pointer">
          <label for="task-completed" class="text-xs font-semibold text-slate-700 cursor-pointer">이 할 일 완료하기</label>
        </div>
        <div class="pt-2 flex justify-between items-center">
          <button type="button" id="btn-delete-task" onclick="deleteTask()" class="hidden px-3 py-2 text-xs font-semibold text-rose-600 hover:bg-rose-50 rounded-lg">할 일 삭제</button>
          <div class="flex gap-2 ml-auto">
            <button type="button" onclick="closeTaskModal()" class="px-4 py-2 text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg">취소</button>
            <button type="submit" class="px-4 py-2 text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-500 rounded-lg">저장</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'personal_project_scheduler_v4';
    const COLORS = ['#3b82f6', '#10b981', '#8b5cf6', '#f59e0b', '#ef4444', '#ec4899', '#06b6d4', '#6366f1'];

    let currentScale = 'day'; // 'day' | 'week' | 'month'
    let baseDate = new Date();
    baseDate.setHours(0, 0, 0, 0);
    let showCompleted = true; // 완료된 항목 보기 필터 여부

    let state = {
      projects: [],
      tasks: []
    };

    function formatDateStr(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function parseDateStr(str) {
      const [y, m, d] = str.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      dt.setHours(0, 0, 0, 0);
      return dt;
    }

    function addDays(date, days) {
      const res = new Date(date);
      res.setDate(res.getDate() + days);
      return res;
    }

    function getDefaultData() {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      return {
        projects: [
          { id: 'p1', name: '매출발생목록', color: '#3b82f6', completed: false },
          { id: 'p2', name: 'ea 개발,자체가동', color: '#10b981', completed: false }
        ],
        tasks: [
          { id: 't1', projectId: 'p1', title: 'EA 자체 가동', start: formatDateStr(today), end: formatDateStr(addDays(today, 3)), completed: false },
          { id: 't2', projectId: 'p1', title: '쇼핑제휴마케팅', start: formatDateStr(addDays(today, 5)), end: formatDateStr(addDays(today, 9)), completed: false },
          { id: 't3', projectId: 'p1', title: '장기프로젝트준비', start: formatDateStr(today), end: formatDateStr(addDays(today, 18)), completed: false },
          { id: 't4', projectId: 'p1', title: '자녀관리앱개발', start: formatDateStr(today), end: formatDateStr(addDays(today, 7)), completed: false },
          { id: 't5', projectId: 'p1', title: '앱개발 론칭(소액가동)', start: formatDateStr(addDays(today, 2)), end: formatDateStr(addDays(today, 7)), completed: false },
          { id: 't6', projectId: 'p1', title: '학원버스 앱개발', start: formatDateStr(addDays(today, 2)), end: formatDateStr(addDays(today, 9)), completed: false },
          { id: 't7', projectId: 'p2', title: '로직 기획서 완료', start: formatDateStr(today), end: formatDateStr(addDays(today, 4)), completed: false },
          { id: 't8', projectId: 'p2', title: '코딩작업', start: formatDateStr(addDays(today, 7)), end: formatDateStr(addDays(today, 10)), completed: false }
        ]
      };
    }

    function loadData() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          state = JSON.parse(saved);
          state.projects.forEach(p => { if (p.completed === undefined) p.completed = false; });
          state.tasks.forEach(t => { if (t.completed === undefined) t.completed = false; });
        } catch (e) {
          state = getDefaultData();
        }
      } else {
        state = getDefaultData();
        saveData();
      }
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function assignTaskLanes(tasks) {
      const sorted = [...tasks].sort((a, b) => {
        if (a.start !== b.start) return a.start.localeCompare(b.start);
        return a.end.localeCompare(b.end);
      });

      const lanes = [];
      const assigned = sorted.map(task => {
        let laneIndex = -1;
        for (let i = 0; i < lanes.length; i++) {
          if (lanes[i] < task.start) {
            laneIndex = i;
            lanes[i] = task.end;
            break;
          }
        }
        if (laneIndex === -1) {
          laneIndex = lanes.length;
          lanes.push(task.end);
        }
        return { ...task, lane: laneIndex };
      });

      return {
        tasks: assigned,
        laneCount: Math.max(1, lanes.length)
      };
    }

    function toggleShowCompleted() {
      showCompleted = document.getElementById('show-completed-checkbox').checked;
      renderScheduler();
    }

    function renderScheduler() {
      const colWidth = currentScale === 'day' ? 48 : currentScale === 'week' ? 28 : 14;
      const startOffset = -15;
      const totalDays = 75;
      const startDate = addDays(baseDate, startOffset);
      const todayStr = formatDateStr(new Date());

      // 1. 날짜 헤더 렌더링
      const headerEl = document.getElementById('timeline-header');
      headerEl.innerHTML = '';
      const dayNames = ['일', '월', '화', '수', '목', '금', '토'];

      for (let i = 0; i < totalDays; i++) {
        const d = addDays(startDate, i);
        const dStr = formatDateStr(d);
        const isToday = dStr === todayStr;
        const isWeekend = d.getDay() === 0 || d.getDay() === 6;

        const cell = document.createElement('div');
        cell.style.width = `${colWidth}px`;
        cell.className = `flex-shrink-0 border-r border-slate-200 flex flex-col items-center justify-center text-xs select-none ${
          isToday ? 'bg-indigo-100 text-indigo-700 font-bold shadow-inner' : isWeekend ? 'bg-slate-100/70 text-slate-500' : 'text-slate-700'
        }`;

        if (currentScale === 'month') {
          cell.innerHTML = d.getDate() === 1 || i === 0
            ? `<span class="text-[10px] font-bold text-indigo-600">${d.getMonth() + 1}월</span>`
            : `<span class="text-[10px]">${d.getDate()}</span>`;
        } else {
          cell.innerHTML = `
            <span class="leading-tight">${d.getDate()}</span>
            <span class="text-[10px] ${isToday ? 'text-indigo-600 font-bold' : 'text-slate-400'}">${dayNames[d.getDay()]}</span>
          `;
        }
        headerEl.appendChild(cell);
      }

      // 2. 좌측 프로젝트 목록 & 우측 타임라인 행 동시 렌더링
      const projectListEl = document.getElementById('project-list-container');
      const timelineRowsEl = document.getElementById('timeline-rows');
      projectListEl.innerHTML = '';
      timelineRowsEl.innerHTML = '';

      const LANE_HEIGHT = 34;   
      const ROW_PADDING = 16;   
      const MIN_ROW_HEIGHT = 56; 

      state.projects.forEach((proj, idx) => {
        // 완료된 항목 보기 필터 적용 (프로젝트가 완료되었거나 필터가 꺼진 경우 처리)
        if (!showCompleted && proj.completed) return;

        const projTasks = state.tasks.filter(t => t.projectId === proj.id && (showCompleted || !t.completed));
        const { tasks: lanedTasks, laneCount } = assignTaskLanes(projTasks);
        const rowHeight = Math.max(MIN_ROW_HEIGHT, laneCount * LANE_HEIGHT + ROW_PADDING);

        // (A) 좌측 프로젝트 행 (완료 시 취소선 및 회색조 처리, 하단 구분선 포함)
        const leftItem = document.createElement('div');
        leftItem.style.height = `${rowHeight}px`;
        
        let projNameHtml = '';
        if (proj.completed) {
          projNameHtml = `<span class="w-3 h-3 rounded-full flex-shrink-0 bg-slate-400"></span>
                          <span class="text-xs sm:text-sm font-medium text-slate-400 truncate line-through flex items-center gap-1">
                            <i class="fa-solid fa-check text-[10px]"></i> ${proj.name}
                          </span>`;
        } else {
          projNameHtml = `<span class="w-3 h-3 rounded-full flex-shrink-0" style="background-color: ${proj.color}"></span>
                          <span class="text-xs sm:text-sm font-medium text-slate-800 truncate group-hover:text-indigo-600">${proj.name}</span>`;
        }

        leftItem.className = 'px-3 border-b border-slate-300 flex items-start justify-between pt-3.5 bg-white hover:bg-slate-50 transition-colors group';
        leftItem.innerHTML = `
          <div onclick="openProjectModal('${proj.id}')" class="flex items-center gap-2 min-w-0 flex-1 cursor-pointer" title="[클릭: 프로젝트 수정]">
            ${projNameHtml}
          </div>
          <div class="flex items-center gap-1 ml-1 flex-shrink-0">
            <button onclick="moveProject(${idx}, -1)" ${idx === 0 ? 'disabled' : ''} class="p-1 text-[11px] text-slate-400 hover:text-slate-700 disabled:opacity-25"><i class="fa-solid fa-arrow-up"></i></button>
            <button onclick="moveProject(${idx}, 1)" ${idx === state.projects.length - 1 ? 'disabled' : ''} class="p-1 text-[11px] text-slate-400 hover:text-slate-700 disabled:opacity-25"><i class="fa-solid fa-arrow-down"></i></button>
          </div>
        `;
        projectListEl.appendChild(leftItem);

        // (B) 우측 타임라인 행 (오늘 수직선 및 하단 구분선 포함)
        const rightRow = document.createElement('div');
        rightRow.style.height = `${rowHeight}px`;
        rightRow.style.width = `${totalDays * colWidth}px`;
        rightRow.className = 'relative border-b border-slate-300 flex';

        for (let i = 0; i < totalDays; i++) {
          const d = addDays(startDate, i);
          const dStr = formatDateStr(d);
          const isToday = dStr === todayStr;
          
          const gridCell = document.createElement('div');
          gridCell.style.width = `${colWidth}px`;
          gridCell.className = `h-full border-r border-slate-100 flex-shrink-0 relative ${isToday ? 'bg-indigo-50/50' : ''}`;
          gridCell.onclick = () => openTaskModal(null, proj.id, dStr);

          if (isToday) {
            const redLine = document.createElement('div');
            redLine.className = 'absolute top-0 bottom-0 w-[2px] bg-red-500 z-10 pointer-events-none left-1/2 -translate-x-1/2';
            gridCell.appendChild(redLine);
          }

          rightRow.appendChild(gridCell);
        }

        // 할 일 막대 렌더링 (프로젝트가 완료되었거나 개별 할 일이 완료된 경우 회색조 + 취소선 처리)
        lanedTasks.forEach(task => {
          const isDone = task.completed || proj.completed;
          const tStart = parseDateStr(task.start);
          const tEnd = parseDateStr(task.end);
          const diffStart = Math.round((tStart - startDate) / (1000 * 60 * 60 * 24));
          const duration = Math.max(1, Math.round((tEnd - tStart) / (1000 * 60 * 60 * 24)) + 1);

          if (diffStart + duration < 0 || diffStart > totalDays) return;

          const bar = document.createElement('div');
          const leftPx = diffStart * colWidth + 2;
          const widthPx = Math.max(colWidth - 4, duration * colWidth - 4);
          const topPx = 8 + task.lane * LANE_HEIGHT;

          bar.style.left = `${leftPx}px`;
          bar.style.width = `${widthPx}px`;
          bar.style.top = `${topPx}px`;
          bar.style.height = '28px';

          if (isDone) {
            bar.style.backgroundColor = '#94a3b8';
            bar.className = 'absolute rounded-lg px-2.5 flex items-center gap-1.5 text-slate-100 text-xs font-medium shadow-sm cursor-pointer opacity-60 hover:opacity-90 transition-all truncate select-none z-20 line-through';
            bar.innerHTML = `<i class="fa-solid fa-check text-[10px]"></i> <span class="truncate">${task.title}</span>`;
          } else {
            bar.style.backgroundColor = proj.color;
            bar.className = 'absolute rounded-lg px-2.5 flex items-center text-white text-xs font-medium shadow-sm cursor-pointer hover:brightness-110 transition-all truncate select-none z-20';
            bar.textContent = task.title;
          }

          bar.title = `${task.title} (${task.start} ~ ${task.end})\n[클릭: 수정 / 더블클릭: 완료 토글]`;
          
          bar.onclick = (e) => {
            e.stopPropagation();
            openTaskModal(task.id);
          };

          bar.ondblclick = (e) => {
            e.stopPropagation();
            toggleTaskComplete(task.id);
          };

          rightRow.appendChild(bar);
        });

        timelineRowsEl.appendChild(rightRow);
      });
    }

    function toggleTaskComplete(taskId) {
      const task = state.tasks.find(t => t.id === taskId);
      if (task) {
        task.completed = !task.completed;
        saveData();
        renderScheduler();
      }
    }

    const timelineContainer = document.getElementById('timeline-container');
    const projectListScroll = document.getElementById('project-list-scroll');
    timelineContainer.addEventListener('scroll', () => {
      projectListScroll.scrollTop = timelineContainer.scrollTop;
    });

    function setScale(scale) {
      currentScale = scale;
      ['day', 'week', 'month'].forEach(s => {
        const btn = document.getElementById(`btn-scale-${s}`);
        if (s === scale) {
          btn.className = 'px-2 sm:px-2.5 py-1 text-xs font-medium rounded transition-colors bg-indigo-600 text-white shadow';
        } else {
          btn.className = 'px-2 sm:px-2.5 py-1 text-xs font-medium rounded text-slate-300 hover:text-white transition-colors';
        }
      });
      renderScheduler();
    }

    function navigateTimeline(dir) {
      const step = currentScale === 'day' ? 7 : currentScale === 'week' ? 14 : 30;
      baseDate = addDays(baseDate, dir * step);
      renderScheduler();
    }

    function goToToday() {
      baseDate = new Date();
      baseDate.setHours(0, 0, 0, 0);
      renderScheduler();
      scrollToToday();
    }

    function scrollToToday() {
      const colWidth = currentScale === 'day' ? 48 : currentScale === 'week' ? 28 : 14;
      timelineContainer.scrollLeft = Math.max(0, 12 * colWidth);
    }

    function moveProject(index, direction) {
      const targetIndex = index + direction;
      if (targetIndex < 0 || targetIndex >= state.projects.length) return;
      const temp = state.projects[index];
      state.projects[index] = state.projects[targetIndex];
      state.projects[targetIndex] = temp;
      saveData();
      renderScheduler();
    }

    function renderColorPicker(selectedColor) {
      const picker = document.getElementById('color-picker');
      picker.innerHTML = '';
      COLORS.forEach(c => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.style.backgroundColor = c;
        btn.className = `w-7 h-7 rounded-full transition-transform ${selectedColor === c ? 'ring-2 ring-offset-2 ring-slate-800 scale-110' : 'opacity-80 hover:opacity-100'}`;
        btn.onclick = () => {
          document.getElementById('project-color').value = c;
          renderColorPicker(c);
        };
        picker.appendChild(btn);
      });
    }

    function openProjectModal(projectId = null) {
      const modal = document.getElementById('project-modal');
      const titleEl = document.getElementById('project-modal-title');
      const idEl = document.getElementById('project-id');
      const nameEl = document.getElementById('project-name');
      const colorEl = document.getElementById('project-color');
      const completedEl = document.getElementById('project-completed');
      const delBtn = document.getElementById('btn-delete-project');

      if (projectId) {
        const proj = state.projects.find(p => p.id === projectId);
        if (!proj) return;
        titleEl.textContent = '프로젝트 수정';
        idEl.value = proj.id;
        nameEl.value = proj.name;
        colorEl.value = proj.color;
        completedEl.checked = !!proj.completed;
        delBtn.classList.remove('hidden');
        renderColorPicker(proj.color);
      } else {
        titleEl.textContent = '새 프로젝트 추가';
        idEl.value = '';
        nameEl.value = '';
        colorEl.value = COLORS[0];
        completedEl.checked = false;
        delBtn.classList.add('hidden');
        renderColorPicker(COLORS[0]);
      }

      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeProjectModal() {
      const modal = document.getElementById('project-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function saveProject(e) {
      e.preventDefault();
      const id = document.getElementById('project-id').value;
      const name = document.getElementById('project-name').value.trim();
      const color = document.getElementById('project-color').value;
      const completed = document.getElementById('project-completed').checked;
      if (!name) return;

      if (id) {
        const proj = state.projects.find(p => p.id === id);
        if (proj) {
          proj.name = name;
          proj.color = color;
          proj.completed = completed;
          // 프로젝트를 완료하면 소속된 모든 할 일도 함께 완료 처리
          if (completed) {
            state.tasks.forEach(t => {
              if (t.projectId === id) t.completed = true;
            });
          }
        }
      } else {
        state.projects.push({
          id: 'p_' + Date.now(),
          name,
          color,
          completed
        });
      }

      saveData();
      closeProjectModal();
      renderScheduler();
    }

    function deleteProject() {
      const id = document.getElementById('project-id').value;
      if (!id) return;
      if (!confirm('이 프로젝트와 포함된 모든 할 일을 삭제할까요?')) return;
      state.projects = state.projects.filter(p => p.id !== id);
      state.tasks = state.tasks.filter(t => t.projectId !== id);
      saveData();
      closeProjectModal();
      renderScheduler();
    }

    function openTaskModal(taskId = null, defaultProjectId = null, defaultDate = null) {
      if (state.projects.length === 0) {
        alert('먼저 프로젝트를 추가해 주세요.');
        openProjectModal();
        return;
      }

      const modal = document.getElementById('task-modal');
      const titleEl = document.getElementById('task-modal-title');
      const idEl = document.getElementById('task-id');
      const projSelect = document.getElementById('task-project-id');
      const taskTitleEl = document.getElementById('task-title');
      const startEl = document.getElementById('task-start');
      const endEl = document.getElementById('task-end');
      const completedEl = document.getElementById('task-completed');
      const delBtn = document.getElementById('btn-delete-task');

      projSelect.innerHTML = state.projects.map(p => `<option value="${p.id}">${p.name}</option>`).join('');

      if (taskId) {
        const task = state.tasks.find(t => t.id === taskId);
        if (!task) return;
        titleEl.textContent = '할 일 수정';
        idEl.value = task.id;
        projSelect.value = task.projectId;
        taskTitleEl.value = task.title;
        startEl.value = task.start;
        endEl.value = task.end;
        completedEl.checked = !!task.completed;
        delBtn.classList.remove('hidden');
      } else {
        const todayStr = defaultDate || formatDateStr(new Date());
        titleEl.textContent = '새 할 일 추가';
        idEl.value = '';
        projSelect.value = defaultProjectId || state.projects[0].id;
        taskTitleEl.value = '';
        startEl.value = todayStr;
        endEl.value = todayStr;
        completedEl.checked = false;
        delBtn.classList.add('hidden');
      }

      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeTaskModal() {
      const modal = document.getElementById('task-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function saveTask(e) {
      e.preventDefault();
      const id = document.getElementById('task-id').value;
      const projectId = document.getElementById('task-project-id').value;
      const title = document.getElementById('task-title').value.trim();
      const start = document.getElementById('task-start').value;
      let end = document.getElementById('task-end').value;
      const completed = document.getElementById('task-completed').checked;

      if (!title || !start || !end) return;
      if (end < start) end = start;

      if (id) {
        const task = state.tasks.find(t => t.id === id);
        if (task) {
          task.projectId = projectId;
          task.title = title;
          task.start = start;
          task.end = end;
          task.completed = completed;
        }
      } else {
        state.tasks.push({
          id: 't_' + Date.now(),
          projectId,
          title,
          start,
          end,
          completed
        });
      }

      saveData();
      closeTaskModal();
      renderScheduler();
    }

    function deleteTask() {
      const id = document.getElementById('task-id').value;
      if (!id) return;
      state.tasks = state.tasks.filter(t => t.id !== id);
      saveData();
      closeTaskModal();
      renderScheduler();
    }

    function exportData() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `scheduler_backup_${formatDateStr(new Date())}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const parsed = JSON.parse(ev.target.result);
          if (parsed.projects && parsed.tasks) {
            state = parsed;
            saveData();
            renderScheduler();
            alert('복원이 완료되었습니다.');
          }
        } catch (err) {
          alert('올바른 백업 파일이 아닙니다.');
        }
      };
      reader.readAsText(file);
    }

    function resetToSampleData() {
      if (!confirm('초기 샘플 데이터로 되돌릴까요?')) return;
      state = getDefaultData();
      saveData();
      renderScheduler();
    }

    loadData();
    renderScheduler();
    scrollToToday();
  </script>
</body>
</html>
