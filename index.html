<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>개인 프로젝트 스케줄러</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 아이콘 CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        #left-panel {
            position: sticky;
            left: 0;
            z-index: 20;
            background-color: #ffffff;
            -webkit-tap-highlight-color: transparent;
        }
        #timeline-container {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        button, .clickable {
            touch-action: manipulation;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 flex flex-col h-screen overflow-hidden">

    <!-- 상단 헤더 영역 -->
    <header class="bg-slate-900 border-b border-slate-800 px-3 py-2 flex flex-wrap items-center justify-between gap-2 shadow-md flex-shrink-0 z-40 relative">
        <div class="flex items-center space-x-2">
            <div class="bg-indigo-600 text-white p-1.5 rounded-lg text-sm">
                <i class="fa-solid fa-calendar-days"></i>
            </div>
            <div>
                <h1 class="text-sm sm:text-base font-bold text-white leading-tight">개인 프로젝트 스케줄러</h1>
                <p class="text-[10px] sm:text-xs text-slate-400 hidden xs:block">PC와 모바일에서 일정 한눈에 관리</p>
            </div>
        </div>

        <!-- 컨트롤 버튼 그룹 -->
        <div class="flex items-center gap-1 sm:gap-2 flex-wrap">
            <div class="bg-slate-800 p-0.5 rounded-lg flex items-center border border-slate-700">
                <button id="btn-scale-day" onclick="setScale('day')" class="px-2 py-1 text-xs font-medium rounded text-white bg-indigo-600">일</button>
                <button id="btn-scale-week" onclick="setScale('week')" class="px-2 py-1 text-xs font-medium rounded text-slate-300">주</button>
                <button id="btn-scale-month" onclick="setScale('month')" class="px-2 py-1 text-xs font-medium rounded text-slate-300">월</button>
            </div>

            <div class="flex items-center space-x-1 bg-slate-800 p-0.5 rounded-lg border border-slate-700">
                <button onclick="navigateTimeline(-1)" class="px-1.5 py-1 text-xs text-slate-300 hover:text-white"><i class="fa-solid fa-chevron-left"></i></button>
                <button onclick="goToToday()" class="px-2 py-1 text-xs text-slate-300 hover:text-white font-medium">오늘</button>
                <button onclick="navigateTimeline(1)" class="px-1.5 py-1 text-xs text-slate-300 hover:text-white"><i class="fa-solid fa-chevron-right"></i></button>
            </div>

            <button onclick="openProjectModal()" class="px-2 py-1 text-xs font-semibold bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg flex items-center gap-1 cursor-pointer">
                <i class="fa-solid fa-folder-plus"></i> <span class="hidden md:inline">프로젝트</span> 추가
            </button>
            <button onclick="openTaskModal()" class="px-2 py-1 text-xs font-semibold bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg flex items-center gap-1 cursor-pointer">
                <i class="fa-solid fa-plus"></i> 할 일 추가
            </button>
        </div>
    </header>

    <!-- 메인 컨텐츠 영역 -->
    <main class="flex flex-1 overflow-hidden relative">
        <div id="left-panel" class="w-48 sm:w-56 flex-shrink-0 bg-white border-r border-slate-300 flex flex-col shadow-md">
            <div class="px-3 py-3 bg-slate-100 border-b border-slate-300 font-semibold text-xs text-slate-700 flex justify-between items-center h-[48px] flex-shrink-0">
                <span>프로젝트 (클릭 수정)</span>
                <span class="text-[10px] text-slate-500">순서 ▲▼</span>
            </div>
            <div id="project-list-container" class="flex-1 overflow-y-auto divide-y divide-slate-200 text-slate-800 text-xs"></div>
        </div>

        <div id="timeline-container" class="flex-1 overflow-x-auto overflow-y-auto bg-white">
            <div id="timeline-inner" class="min-w-max min-h-full flex flex-col relative text-slate-800">
                <div id="timeline-header" class="sticky top-0 z-10 bg-slate-200 border-b border-slate-300 flex h-[48px] shadow-sm"></div>
                <div id="timeline-rows" class="flex-1 relative"></div>
            </div>
        </div>
    </main>

    <!-- 공통 입력 모달 레이아웃 -->
    <div id="custom-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-800 text-white rounded-xl p-5 w-full max-w-sm shadow-xl border border-slate-700">
            <h3 id="modal-title" class="text-sm font-bold mb-4">입력 창</h3>
            <div id="modal-body" class="space-y-3 text-xs">
                <!-- 동적 폼 삽입 영역 -->
            </div>
            <div class="flex justify-end space-x-2 mt-5">
                <button onclick="closeModal()" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded text-xs">취소</button>
                <button id="modal-submit-btn" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 rounded text-xs font-semibold">저장</button>
            </div>
        </div>
    </div>

    <!-- 스크립트 로직 -->
    <script>
        let currentScale = 'day';
        let currentDate = new Date();

        let projects = [
            { id: 1, name: '웹사이트 리뉴얼', color: '#3b82f6' },
            { id: 2, name: '신규 앱 개발', color: '#10b981' }
        ];

        let tasks = [
            { id: 1, projectId: 1, name: '요구사항 정의', startDate: '2026-11-18', endDate: '2026-11-22' },
            { id: 2, projectId: 1, name: 'UI/UX 디자인', startDate: '2026-11-22', endDate: '2026-11-26' },
            { id: 3, projectId: 2, name: '아키텍처 설계', startDate: '2026-11-17', endDate: '2026-11-21' }
        ];

        function setScale(scale) {
            currentScale = scale;
            document.querySelectorAll('#btn-scale-day, #btn-scale-week, #btn-scale-month').forEach(btn => {
                btn.className = "px-2 py-1 text-xs font-medium rounded text-slate-300";
            });
            document.getElementById(`btn-scale-${scale}`).className = "px-2 py-1 text-xs font-medium rounded text-white bg-indigo-600";
            renderScheduler();
        }

        function navigateTimeline(direction) {
            if (currentScale === 'day') {
                currentDate.setDate(currentDate.getDate() + (direction * 7));
            } else if (currentScale === 'week') {
                currentDate.setDate(currentDate.getDate() + (direction * 14));
            } else {
                currentDate.setMonth(currentDate.getMonth() + direction);
            }
            renderScheduler();
        }

        function goToToday() {
            currentDate = new Date();
            renderScheduler();
        }

        function renderScheduler() {
            const header = document.getElementById('timeline-header');
            const rows = document.getElementById('timeline-rows');
            const projectList = document.getElementById('project-list-container');

            header.innerHTML = '';
            rows.innerHTML = '';
            projectList.innerHTML = '';

            let dates = [];
            let start = new Date(currentDate);
            start.setDate(start.getDate() - 3);
            for (let i = 0; i < 30; i++) {
                let d = new Date(start);
                d.setDate(start.getDate() + i);
                dates.push(d);
            }

            dates.forEach(d => {
                let cell = document.createElement('div');
                cell.className = "w-16 flex-shrink-0 flex flex-col items-center justify-center border-r border-slate-300 text-[11px]";
                let dayNames = ['일', '월', '화', '수', '목', '금', '토'];
                cell.innerHTML = `<span class="font-bold">${d.getDate()}</span><span class="text-slate-500">${dayNames[d.getDay()]}</span>`;
                header.appendChild(cell);
            });

            projects.forEach(project => {
                let pDiv = document.createElement('div');
                pDiv.className = "px-3 py-4 flex items-center justify-between border-b border-slate-200 h-16 box-border cursor-pointer hover:bg-slate-50 active:bg-slate-100";
                pDiv.innerHTML = `
                    <div class="flex items-center space-x-2 truncate pointer-events-none">
                        <span class="w-2.5 h-2.5 rounded-full flex-shrink-0" style="background-color: ${project.color};"></span>
                        <span class="truncate font-medium">${project.name}</span>
                    </div>
                    <div class="flex items-center space-x-1 text-slate-400">
                        <button onclick="event.stopPropagation(); moveProject(${project.id}, -1)" class="p-1 hover:text-slate-700"><i class="fa-solid fa-arrow-up text-[10px]"></i></button>
                        <button onclick="event.stopPropagation(); moveProject(${project.id}, 1)" class="p-1 hover:text-slate-700"><i class="fa-solid fa-arrow-down text-[10px]"></i></button>
                    </div>
                `;
                pDiv.onclick = () => openEditProjectModal(project.id);
                projectList.appendChild(pDiv);

                let rDiv = document.createElement('div');
                rDiv.className = "flex border-b border-slate-200 h-16 relative box-border";
                
                dates.forEach(() => {
                    let gridCell = document.createElement('div');
                    gridCell.className = "w-16 flex-shrink-0 border-r border-slate-200 h-full";
                    rDiv.appendChild(gridCell);
                });

                tasks.filter(t => t.projectId === project.id).forEach(task => {
                    let taskBar = document.createElement('div');
                    taskBar.className = "absolute top-3 h-10 text-white rounded-lg px-2 flex items-center text-xs shadow-sm truncate cursor-pointer active:opacity-80";
                    taskBar.style.backgroundColor = project.color;
                    
                    let startDateObj = new Date(task.startDate);
                    let diffDays = Math.floor((startDateObj - start) / (1000 * 60 * 60 * 24));
                    let duration = Math.floor((new Date(task.endDate) - startDateObj) / (1000 * 60 * 60 * 24)) + 1;

                    taskBar.style.left = `${diffDays * 64}px`;
                    taskBar.style.width = `${duration * 64 - 4}px`;
                    taskBar.innerText = task.name;
                    taskBar.onclick = () => openEditTaskModal(task.id);

                    rDiv.appendChild(taskBar);
                });

                rows.appendChild(rDiv);
            });
        }

        // 실제 동작하는 모달 폼 제어 함수들
        function openModal() { document.getElementById('custom-modal').classList.remove('hidden'); }
        function closeModal() { document.getElementById('custom-modal').classList.add('hidden'); }

        function openProjectModal() {
            document.getElementById('modal-title').innerText = '새 프로젝트 추가';
            document.getElementById('modal-body').innerHTML = `
                <div>
                    <label class="block text-slate-400 mb-1">프로젝트명</label>
                    <input type="text" id="input-p-name" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-white" placeholder="프로젝트 이름 입력">
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">색상 선택</label>
                    <input type="color" id="input-p-color" value="#3b82f6" class="w-full h-9 bg-slate-900 border border-slate-700 rounded px-1 cursor-pointer">
                </div>
            `;
            document.getElementById('modal-submit-btn').onclick = function() {
                let name = document.getElementById('input-p-name').value;
                let color = document.getElementById('input-p-color').value;
                if(!name) { alert('프로젝트 이름을 입력해주세요.'); return; }
                projects.push({ id: Date.now(), name, color });
                closeModal();
                renderScheduler();
            };
            openModal();
        }

        function openEditProjectModal(id) {
            let p = projects.find(item => item.id === id);
            if(!p) return;
            document.getElementById('modal-title').innerText = '프로젝트 수정 / 삭제';
            document.getElementById('modal-body').innerHTML = `
                <div>
                    <label class="block text-slate-400 mb-1">프로젝트명</label>
                    <input type="text" id="input-p-name" value="${p.name}" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-white">
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">색상 선택</label>
                    <input type="color" id="input-p-color" value="${p.color}" class="w-full h-9 bg-slate-900 border border-slate-700 rounded px-1 cursor-pointer">
                </div>
                <div class="pt-2 flex justify-between">
                    <button onclick="deleteProject(${p.id})" class="px-3 py-1.5 bg-rose-600 hover:bg-rose-500 rounded text-xs font-semibold text-white">프로젝트 삭제</button>
                </div>
            `;
            document.getElementById('modal-submit-btn').onclick = function() {
                p.name = document.getElementById('input-p-name').value;
                p.color = document.getElementById('input-p-color').value;
                closeModal();
                renderScheduler();
            };
            openModal();
        }

        function deleteProject(id) {
            if(confirm('정말 이 프로젝트와 하위 할 일을 모두 삭제하시겠습니까?')) {
                projects = projects.filter(p => p.id !== id);
                tasks = tasks.filter(t => t.projectId !== id);
                closeModal();
                renderScheduler();
            }
        }

        function openTaskModal() {
            if(projects.length === 0) { alert('먼저 프로젝트를 추가해주세요.'); return; }
            let options = projects.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
            let todayStr = new Date().toISOString().split('T')[0];

            document.getElementById('modal-title').innerText = '새 할 일 추가';
            document.getElementById('modal-body').innerHTML = `
                <div>
                    <label class="block text-slate-400 mb-1">소속 프로젝트</label>
                    <select id="input-t-pid" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-white">${options}</select>
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">할 일 이름</label>
                    <input type="text" id="input-t-name" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-white" placeholder="할 일 입력">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-slate-400 mb-1">시작일</label>
                        <input type="date" id="input-t-start" value="${todayStr}" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-2 text-white">
                    </div>
                    <div>
                        <label class="block text-slate-400 mb-1">종료일</label>
                        <input type="date" id="input-t-end" value="${todayStr}" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-2 text-white">
                    </div>
                </div>
            `;
            document.getElementById('modal-submit-btn').onclick = function() {
                let projectId = Number(document.getElementById('input-t-pid').value);
                let name = document.getElementById('input-t-name').value;
                let startDate = document.getElementById('input-t-start').value;
                let endDate = document.getElementById('input-t-end').value;

                if(!name) { alert('할 일 이름을 입력해주세요.'); return; }
                tasks.push({ id: Date.now(), projectId, name, startDate, endDate });
                closeModal();
                renderScheduler();
            };
            openModal();
        }

        function openEditTaskModal(id) {
            let t = tasks.find(item => item.id === id);
            if(!t) return;
            let options = projects.map(p => `<option value="${p.id}" ${p.id === t.projectId ? 'selected' : ''}>${p.name}</option>`).join('');

            document.getElementById('modal-title').innerText = '할 일 수정 / 삭제';
            document.getElementById('modal-body').innerHTML = `
                <div>
                    <label class="block text-slate-400 mb-1">소속 프로젝트</label>
                    <select id="input-t-pid" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-white">${options}</select>
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">할 일 이름</label>
                    <input type="text" id="input-t-name" value="${t.name}" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-white">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-slate-400 mb-1">시작일</label>
                        <input type="date" id="input-t-start" value="${t.startDate}" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-2 text-white">
                    </div>
                    <div>
                        <label class="block text-slate-400 mb-1">종료일</label>
                        <input type="date" id="input-t-end" value="${t.endDate}" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-2 text-white">
                    </div>
                </div>
                <div class="pt-2 flex justify-between">
                    <button onclick="deleteTask(${t.id})" class="px-3 py-1.5 bg-rose-600 hover:bg-rose-500 rounded text-xs font-semibold text-white">할 일 삭제</button>
                </div>
            `;
            document.getElementById('modal-submit-btn').onclick = function() {
                t.projectId = Number(document.getElementById('input-t-pid').value);
                t.name = document.getElementById('input-t-name').value;
                t.startDate = document.getElementById('input-t-start').value;
                t.endDate = document.getElementById('input-t-end').value;
                closeModal();
                renderScheduler();
            };
            openModal();
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            closeModal();
            renderScheduler();
        }

        function moveProject(id, direction) {
            let index = projects.findIndex(p => p.id === id);
            if (index < 0) return;
            let targetIndex = index + direction;
            if (targetIndex < 0 || targetIndex >= projects.length) return;
            let temp = projects[index];
            projects[index] = projects[targetIndex];
            projects[targetIndex] = temp;
            renderScheduler();
        }

        window.onload = function() {
            renderScheduler();
        };
    </script>
</body>
</html>
